# Reusable: terraform apply terraform/apps/<app> with an image from ECR refplatform/<app>.
# image_tag empty = redeploy the image currently in state (used by apps-redeploy-all).
name: _deploy-app

on:
  workflow_call:
    inputs:
      app:
        description: App name (terraform/apps/<app>, ECR refplatform/<app>)
        required: true
        type: string
      image_tag:
        description: Existing ECR tag to deploy. Empty = keep the currently deployed image.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: refplatform-deploy-${{ inputs.app }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: terraform/apps/${{ inputs.app }}
    env:
      APP: ${{ inputs.app }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      TF_VERSION: "1.10.5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check inputs
        run: |
          if ! [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "Set the repository variable AWS_ACCOUNT_ID (12 digits)." >&2
            exit 1
          fi
          if [ -n "$IMAGE_TAG" ] && ! [[ "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Invalid image tag: $IMAGE_TAG" >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/refplatform-gh-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=refplatform-tfstate-${AWS_ACCOUNT_ID}" \
            -backend-config="region=${AWS_REGION}"

      - name: Resolve image
        id: image
        run: |
          REPOSITORY="refplatform/${APP}"
          if [ -n "$IMAGE_TAG" ]; then
            IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${REPOSITORY}:${IMAGE_TAG}"
            aws ecr describe-images --repository-name "$REPOSITORY" --image-ids "imageTag=${IMAGE_TAG}" --region "$AWS_REGION" >/dev/null
          else
            IMAGE_URI="$(terraform output -raw image 2>/dev/null || true)"
            if [ -z "$IMAGE_URI" ]; then
              echo "::notice::${APP} has never been deployed and no image_tag was given. Skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "Deploying \`${IMAGE_URI}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        if: steps.image.outputs.skip == 'false'
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          terraform apply -input=false -auto-approve \
            -var="image=${IMAGE_URI}" \
            -var="aws_region=${AWS_REGION}"

      - name: App URL
        if: steps.image.outputs.skip == 'false'
        run: |
          URL="$(terraform output -raw url)"
          echo "URL: ${URL}"
          echo "URL: ${URL}" >> "$GITHUB_STEP_SUMMARY"
